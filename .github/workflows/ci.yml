name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    concurrency:
      group: ci-${{ github.ref }}-lint-${{ strategy.job-index }}
      cancel-in-progress: true
    name: lint and format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install shfmt
        run: |
          set -euo pipefail
          gh release download v3.14.1 --repo mvdan/sh --pattern 'shfmt_v3.14.1_linux_amd64' --output shfmt
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt" | sha256sum -c -
          sudo install -m 755 shfmt /usr/local/bin/shfmt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo koalaman/shellcheck \
            --pattern 'shellcheck-v0.11.0.linux.x86_64.tar.xz' --output shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 --wildcards '*/shellcheck'
          sudo install -m 755 shellcheck /usr/local/bin/shellcheck
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install mandoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mandoc

      - name: shfmt, ShellCheck and mandoc at zero findings
        run: make lint

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  test:
    concurrency:
      group: ci-${{ github.ref }}-test-${{ strategy.job-index }}
      cancel-in-progress: true
    name: test on ${{ matrix.os }}, ${{ matrix.toolset }} tools
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            toolset: native
          - os: ubuntu-26.04
            toolset: gnu
          - os: ubuntu-26.04
            toolset: uutils
          - os: macos-26
            toolset: native
          - os: macos-26
            toolset: homebrew
          - os: macos-26
            toolset: uutils
          - os: macos-26-intel
            toolset: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y age bats ksh

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install --formula age bats-core bash zsh

      - name: Report the environment
        run: |
          bash --version | head -1
          age --version
          openssl version
          bats --version

      - name: Install the GNU toolset on Linux
        if: runner.os == 'Linux' && matrix.toolset == 'gnu'
        run: sudo apt-get install -y gnu-coreutils gawk

      - name: Install the uutils toolset on Linux
        if: runner.os == 'Linux' && matrix.toolset == 'uutils'
        run: sudo apt-get install -y rust-coreutils

      - name: Install the Homebrew toolset on macOS
        if: runner.os == 'macOS' && matrix.toolset == 'homebrew'
        run: brew install --formula coreutils findutils gnu-sed gawk grep diffutils openssl@3 curl openssh gzip

      - name: Install the uutils toolset on macOS
        if: runner.os == 'macOS' && matrix.toolset == 'uutils'
        run: brew install --formula uutils-coreutils uutils-diffutils uutils-findutils

      - name: Put the ${{ matrix.toolset }} toolset first on PATH
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" >> "${GITHUB_PATH}"

      - name: Show which builds the run uses
        run: |
          for tool in bash zsh openssl curl ssh-keygen gzip; do
            printf '%-10s %s\n' "${tool}" "$(command -v "${tool}" || printf missing)"
          done
          openssl version
          curl --version | head -1

      - name: Show which tools the run uses
        run: ./bin/fusho doctor

      - name: Run the suite
        run: bats --print-output-on-failure test

  shells:
    concurrency:
      group: ci-${{ github.ref }}-shells-${{ strategy.job-index }}
      cancel-in-progress: true
    name: posix shell conformance
    runs-on: ubuntu-26.04
    container: debian:stable-slim
    steps:
      - name: Install shells and dependencies
        run: |
          apt-get update
          apt-get install -y age openssh-client openssl curl python3 ca-certificates git bats
          for shell in dash mksh ksh posh zsh busybox-static; do
            apt-get install -y "$shell" || echo "skipping unavailable shell: $shell"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Round trip under every installed shell dialect
        run: bats --print-output-on-failure test/portability.bats

  musl:
    concurrency:
      group: ci-${{ github.ref }}-musl-${{ strategy.job-index }}
      cancel-in-progress: true
    name: musl and busybox
    runs-on: ubuntu-26.04
    container: alpine:latest
    steps:
      - name: Install dependencies
        run: apk add --no-cache age openssh-keygen openssl curl python3 bash bats git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Prove it runs where bash is absent
        run: |
          set -eu
          apk del bash bats || true
          if command -v bash; then
            echo "bash is still present, the check proves nothing" >&2
            exit 1
          fi
          ./bin/fusho version

      - name: Full suite under musl
        run: |
          apk add --no-cache bash bats
          bats --print-output-on-failure test

  coverage:
    concurrency:
      group: ci-${{ github.ref }}-coverage-${{ strategy.job-index }}
      cancel-in-progress: true
    name: coverage gate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        with:
          bundler-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age bats ksh openssh-client openssl curl python3 qrencode

      - name: Enforce the coverage gate
        run: bash scripts/coverage.sh 100

  interop-encrypt:
    concurrency:
      group: ci-${{ github.ref }}-interop-encrypt-${{ strategy.job-index }}
      cancel-in-progress: true
    name: encrypt on macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: brew install age

      - name: Encrypt a message addressed to an ephemeral key
        run: |
          set -euo pipefail
          mkdir -p interop/.ssh interop/served
          ssh-keygen -q -t ed25519 -N '' -C interop -f interop/.ssh/id_ed25519 </dev/null
          awk '{print $1" "$2}' interop/.ssh/id_ed25519.pub > interop/served/alice.keys
          python3 test/helpers/keyserver.py interop/served > interop/port 2>/dev/null &
          for _ in $(seq 1 60); do [ -s interop/port ] && break; sleep 0.1; done
          printf 'interop secret\nacentuacao: cao cedilha\ntrailing line\n' > interop/original.txt
          FUSHO_GITHUB_BASE="http://127.0.0.1:$(cat interop/port)" HOME="$PWD/interop" \
            ./bin/fusho send alice --no-clipboard < interop/original.txt > interop/message.txt
          shasum -a 256 interop/original.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: interop-bundle
          path: |
            interop/message.txt
            interop/original.txt
            interop/.ssh/id_ed25519
          include-hidden-files: true
          retention-days: 1

  interop-decrypt:
    concurrency:
      group: ci-${{ github.ref }}-interop-decrypt-${{ strategy.job-index }}
      cancel-in-progress: true
    name: decrypt on Linux
    runs-on: ubuntu-26.04
    needs: interop-encrypt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: interop-bundle
          path: interop

      - name: Decrypt the macOS message and compare
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          install -m 0600 interop/.ssh/id_ed25519 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          ./bin/fusho read interop/message.txt > recovered.txt
          sha256sum recovered.txt interop/original.txt
          cmp recovered.txt interop/original.txt
          echo "macOS to Linux round trip is byte identical"

  release:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    name: release
    runs-on: ubuntu-26.04
    needs: [lint, test, shells, musl, coverage, interop-decrypt]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*

      - name: Install release tooling
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Audit the release tooling
        run: pnpm audit --audit-level high

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Record the tag a release just published
        id: published
        run: echo "tag=$(git tag --points-at HEAD | head -n 1)" >> "${GITHUB_OUTPUT}"

  formula:
    concurrency:
      group: formula-${{ github.ref }}
      cancel-in-progress: false
    name: formula
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/formula.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
