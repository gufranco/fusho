name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5,13,21 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh:
    name: decide whether this commit needs checking
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - name: Skip a scheduled run on a commit CI already passed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run=true
          if [ "${EVENT}" = schedule ]; then
            passed="$(gh run list --repo "${REPO}" --workflow ci --branch main --status success \
              --limit 20 --json headSha -q '.[].headSha')"
            if grep -qxF "${SHA}" <<<"${passed}"; then
              run=false
            fi
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  lint:
    name: lint and format
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1

      - name: Install shfmt
        run: |
          set -euo pipefail
          gh release download v3.14.1 --repo mvdan/sh --pattern 'shfmt_v3.14.1_linux_amd64' --output shfmt
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt" | sha256sum -c -
          sudo install -m 755 shfmt /usr/local/bin/shfmt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo koalaman/shellcheck \
            --pattern 'shellcheck-v0.11.0.linux.x86_64.tar.xz' --output shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 --wildcards '*/shellcheck'
          sudo install -m 755 shellcheck /usr/local/bin/shellcheck
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install mandoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mandoc

      - name: shfmt, ShellCheck and mandoc at zero findings
        run: make lint

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  test:
    name: test (${{ matrix.runner }}, ${{ matrix.shell }}, ${{ matrix.toolset }})
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            shell: dash
            toolset: native
          - runner: ubuntu-26.04
            shell: zsh
            toolset: native
          - runner: ubuntu-26.04
            shell: bash
            toolset: native
          - runner: ubuntu-26.04
            shell: dash
            toolset: gnu
          - runner: ubuntu-26.04
            shell: dash
            toolset: uutils
          - runner: macos-26
            shell: /bin/sh
            toolset: native
          - runner: macos-26
            shell: /bin/bash
            toolset: native
          - runner: macos-26
            shell: /bin/zsh
            toolset: native
          - runner: macos-26
            shell: /bin/sh
            toolset: homebrew
          - runner: macos-26
            shell: /opt/homebrew/bin/bash
            toolset: homebrew
          - runner: macos-26
            shell: /opt/homebrew/bin/zsh
            toolset: homebrew
          - runner: macos-26
            shell: /bin/sh
            toolset: uutils
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and tools (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age bats dash zsh mandoc
      - name: Install shells and tools (macOS)
        if: runner.os == 'macOS'
        run: brew install --formula age bats-core bash dash zsh
      - name: Install the GNU toolset (Linux)
        if: runner.os == 'Linux' && matrix.toolset == 'gnu'
        run: sudo apt-get install -y -qq gnu-coreutils gawk
      - name: Install the uutils toolset (Linux)
        if: runner.os == 'Linux' && matrix.toolset == 'uutils'
        run: sudo apt-get install -y -qq rust-coreutils
      - name: Install the Homebrew toolset (macOS)
        if: runner.os == 'macOS' && matrix.toolset == 'homebrew'
        run: brew install --formula coreutils findutils gnu-sed gawk grep diffutils openssl@3 curl openssh gzip
      - name: Install the uutils toolset (macOS)
        if: runner.os == 'macOS' && matrix.toolset == 'uutils'
        run: brew install --formula uutils-coreutils uutils-diffutils uutils-findutils
      - name: Put the ${{ matrix.toolset }} toolset first on PATH
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" >> "${GITHUB_PATH}"
      - name: Show which shell runs the suites
        if: contains(matrix.shell, 'bash') || contains(matrix.shell, 'zsh')
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: '"${SHELL_UNDER_TEST}" --version | head -n 1'
      - name: Show which tools the run uses
        run: sh bin/fusho doctor
      - name: Run the suites under ${{ matrix.shell }}
        env:
          FUSHO_TEST_SHELLS: ${{ matrix.shell }}
        run: sh test/run-matrix.sh

  shells:
    name: posix shell conformance
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: ubuntu-26.04
    container: debian:stable-slim
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - name: Install shells and dependencies
        run: |
          apt-get update
          apt-get install -y age openssh-client openssl curl python3 ca-certificates git bats
          for shell in dash mksh posh zsh busybox-static; do
            apt-get install -y "$shell" || echo "skipping unavailable shell: $shell"
          done

      - uses: actions/checkout@v7.0.1

      - name: Round trip under every installed shell dialect
        run: bats --print-output-on-failure test/portability.bats

  musl:
    name: musl and busybox
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: ubuntu-26.04
    container: alpine:latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - name: Install dependencies
        run: apk add --no-cache age openssh-keygen openssl curl python3 bash bats git

      - uses: actions/checkout@v7.0.1

      - name: Prove it runs where bash is absent
        run: |
          set -eu
          apk del bash bats || true
          if command -v bash; then
            echo "bash is still present, the check proves nothing" >&2
            exit 1
          fi
          ./bin/fusho version

      - name: Full suite under musl
        run: |
          apk add --no-cache bash bats
          bats --print-output-on-failure test

  coverage:
    name: coverage gate
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        with:
          bundler-cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age bats openssh-client openssl curl python3 qrencode

      - name: Enforce the coverage gate
        run: bash scripts/coverage.sh 100

  interop-encrypt:
    name: encrypt on macOS
    needs: fresh
    if: needs.fresh.outputs.run == 'true'
    runs-on: macos-26
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: brew install age

      - name: Encrypt a message addressed to an ephemeral key
        run: |
          set -euo pipefail
          mkdir -p interop/.ssh interop/served
          ssh-keygen -q -t ed25519 -N '' -C interop -f interop/.ssh/id_ed25519 </dev/null
          awk '{print $1" "$2}' interop/.ssh/id_ed25519.pub > interop/served/alice.keys
          python3 test/keyserver.py interop/served > interop/port 2>/dev/null &
          for _ in $(seq 1 60); do [ -s interop/port ] && break; sleep 0.1; done
          printf 'interop secret\nacentuacao: cao cedilha\ntrailing line\n' > interop/original.txt
          FUSHO_GITHUB_BASE="http://127.0.0.1:$(cat interop/port)" HOME="$PWD/interop" \
            ./bin/fusho send alice --no-clipboard < interop/original.txt > interop/message.txt
          shasum -a 256 interop/original.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: interop-bundle
          path: |
            interop/message.txt
            interop/original.txt
            interop/.ssh/id_ed25519
          include-hidden-files: true
          retention-days: 1

  interop-decrypt:
    name: decrypt on Linux
    runs-on: ubuntu-26.04
    needs: interop-encrypt
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - uses: actions/download-artifact@v8.0.2
        with:
          name: interop-bundle
          path: interop

      - name: Decrypt the macOS message and compare
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          install -m 0600 interop/.ssh/id_ed25519 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          ./bin/fusho read interop/message.txt > recovered.txt
          sha256sum recovered.txt interop/original.txt
          cmp recovered.txt interop/original.txt
          echo "macOS to Linux round trip is byte identical"
