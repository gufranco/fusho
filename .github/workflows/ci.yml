---
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  FUSHO_TEST_JOBS: "4"

jobs:
  plan:
    name: choose the macOS legs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.choose.outputs.macos }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - name: Run every macOS leg except on a bot pull request
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          legs='[{"shell":"/bin/sh","toolset":"native","coverage":false},{"shell":"/bin/bash","toolset":"native","coverage":false},{"shell":"/bin/zsh","toolset":"native","coverage":false},{"shell":"/opt/homebrew/bin/bash","toolset":"homebrew","coverage":true},{"shell":"/opt/homebrew/bin/zsh","toolset":"homebrew","coverage":false},{"shell":"/bin/sh","toolset":"uutils","coverage":false}]'
          case "${EVENT}:${AUTHOR}" in
          'pull_request:dependabot[bot]' | 'pull_request:renovate[bot]')
            legs='[{"shell":"/opt/homebrew/bin/bash","toolset":"homebrew","coverage":true}]'
            ;;
          *) ;;
          esac
          echo "macos=${legs}" >> "${GITHUB_OUTPUT}"

  lint:
    name: lint and format
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1

      - name: Install shfmt
        run: |
          set -euo pipefail
          gh release download v3.14.1 --repo mvdan/sh --pattern 'shfmt_v3.14.1_linux_amd64' --output shfmt
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt" | sha256sum -c -
          sudo install -m 755 shfmt /usr/local/bin/shfmt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo koalaman/shellcheck \
            --pattern 'shellcheck-v0.11.0.linux.x86_64.tar.xz' --output shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 --wildcards '*/shellcheck'
          sudo install -m 755 shellcheck /usr/local/bin/shellcheck
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install mandoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mandoc

      - name: shfmt, ShellCheck and mandoc at zero findings
        run: make lint

      - name: Lint the workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

  test-linux:
    name: test (linux, ${{ matrix.shell }}, ${{ matrix.toolset }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: dash
            toolset: native
            coverage: false
          - shell: zsh
            toolset: native
            coverage: false
          - shell: bash
            toolset: native
            coverage: true
          - shell: dash
            toolset: gnu
            coverage: false
          - shell: dash
            toolset: uutils
            coverage: false
          - shell: dash
            toolset: busybox
            coverage: false
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.toolset }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Install shells and tools
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: |
          set -euo pipefail
          extra=()
          case "${TOOLSET}" in
          gnu) extra=(gnu-coreutils gawk) ;;
          uutils) extra=(rust-coreutils) ;;
          busybox) extra=(busybox) ;;
          *) ;;
          esac
          mkdir -p "${HOME}/apt-archives/partial"
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::Archives="${HOME}/apt-archives" -o APT::Sandbox::User=root \
            bats dash zsh mandoc parallel age openssh-client openssl curl python3 qrencode "${extra[@]}"
          sudo chown -R "$(id -u):$(id -g)" "${HOME}/apt-archives"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        if: matrix.coverage
        with:
          bundler-cache: true
      - name: Build the ${{ matrix.toolset }} toolset
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh .github/scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" > "${RUNNER_TEMP}/toolset-path"
      - name: Show which shell runs the suites
        if: contains(matrix.shell, 'bash') || contains(matrix.shell, 'zsh')
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: '"${SHELL_UNDER_TEST}" --version | head -n 1'
      - name: Show which tools the run uses
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh bin/fusho doctor
      - name: Run the suites under ${{ matrix.shell }}
        if: ${{ !matrix.coverage }}
        env:
          FUSHO_TEST_SHELLS: ${{ matrix.shell }}
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh test/run-matrix.sh
      - name: Run the suites under bashcov
        if: matrix.coverage
        run: |
          ruby_dir="$(dirname "$(command -v ruby)")"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${ruby_dir}:${dirs:+${dirs}:}${PATH}" sh scripts/coverage.sh 0
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.coverage
        with:
          name: coverage-Linux
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 1

  test-macos:
    name: test (macos, ${{ matrix.shell }}, ${{ matrix.toolset }})
    needs: [plan, lint, test-linux]
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and tools
        run: brew install --formula bats-core bash dash-shell zsh parallel age
      - name: Install the Homebrew toolset
        if: matrix.toolset == 'homebrew'
        run: brew install --formula coreutils findutils gnu-sed gawk grep diffutils openssl@3 curl openssh gzip
      - name: Install the uutils toolset
        if: matrix.toolset == 'uutils'
        run: brew install --formula uutils-coreutils uutils-diffutils uutils-findutils
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f  # v1.335.0
        if: matrix.coverage
        with:
          bundler-cache: true
      - name: Build the ${{ matrix.toolset }} toolset
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh .github/scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" > "${RUNNER_TEMP}/toolset-path"
      - name: Show which shell runs the suites
        if: contains(matrix.shell, 'bash') || contains(matrix.shell, 'zsh')
        env:
          SHELL_UNDER_TEST: ${{ matrix.shell }}
        run: '"${SHELL_UNDER_TEST}" --version | head -n 1'
      - name: Show which tools the run uses
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh bin/fusho doctor
      - name: Run the suites under ${{ matrix.shell }}
        if: ${{ !matrix.coverage }}
        env:
          FUSHO_TEST_SHELLS: ${{ matrix.shell }}
        run: |
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh test/run-matrix.sh
      - name: Run the suites under bashcov
        if: matrix.coverage
        run: |
          ruby_dir="$(dirname "$(command -v ruby)")"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${ruby_dir}:${dirs:+${dirs}:}${PATH}" sh scripts/coverage.sh 0
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.coverage
        with:
          name: coverage-macOS
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 1

  coverage-gate:
    name: coverage gate
    needs: [test-linux, test-macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: results
      - name: Merge both platforms and enforce 100% line coverage
        run: >-
          python3 scripts/coverage-gate.py '/(bin/fusho|lib/[a-z]+\.sh)\Z' 100
          results/coverage-Linux/.resultset.json results/coverage-macOS/.resultset.json

  shells:
    name: posix shell conformance
    runs-on: ubuntu-26.04
    container: debian:stable-slim
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - name: Install shells and dependencies
        run: |
          apt-get update
          apt-get install -y age openssh-client openssl curl python3 ca-certificates git bats
          for shell in dash mksh posh zsh busybox-static; do
            apt-get install -y "$shell" || echo "skipping unavailable shell: $shell"
          done

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Round trip under every installed shell dialect
        run: bats --print-output-on-failure test/portability.bats

  musl:
    name: musl and busybox
    runs-on: ubuntu-26.04
    container: alpine:latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - name: Install dependencies
        run: apk add --no-cache age openssh-keygen openssl curl python3 bash bats git

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Prove it runs where bash is absent
        run: |
          set -eu
          apk del bash bats || true
          if command -v bash; then
            echo "bash is still present, the check proves nothing" >&2
            exit 1
          fi
          ./bin/fusho version

      - name: Full suite under musl
        run: |
          apk add --no-cache bash bats
          bats --print-output-on-failure test

  interop-encrypt:
    name: encrypt on macOS
    needs: [lint, test-linux]
    runs-on: macos-26
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: brew install age

      - name: Encrypt a message addressed to an ephemeral key
        run: |
          set -euo pipefail
          mkdir -p interop/.ssh interop/served
          ssh-keygen -q -t ed25519 -N '' -C interop -f interop/.ssh/id_ed25519 </dev/null
          awk '{print $1" "$2}' interop/.ssh/id_ed25519.pub > interop/served/alice.keys
          python3 test/keyserver.py interop/served > interop/port 2>/dev/null &
          for _ in $(seq 1 60); do [ -s interop/port ] && break; sleep 0.1; done
          printf 'interop secret\nacentuacao: cao cedilha\ntrailing line\n' > interop/original.txt
          FUSHO_GITHUB_BASE="http://127.0.0.1:$(cat interop/port)" HOME="$PWD/interop" \
            ./bin/fusho send alice --no-clipboard < interop/original.txt > interop/message.txt
          shasum -a 256 interop/original.txt

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: interop-bundle
          path: |
            interop/message.txt
            interop/original.txt
            interop/.ssh/id_ed25519
          include-hidden-files: true
          retention-days: 1

  interop-decrypt:
    name: decrypt on Linux
    runs-on: ubuntu-26.04
    needs: interop-encrypt
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age

      - uses: actions/download-artifact@v8.0.2
        with:
          name: interop-bundle
          path: interop

      - name: Decrypt the macOS message and compare
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          install -m 0600 interop/.ssh/id_ed25519 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          ./bin/fusho read interop/message.txt > recovered.txt
          sha256sum recovered.txt interop/original.txt
          cmp recovered.txt interop/original.txt
          echo "macOS to Linux round trip is byte identical"
