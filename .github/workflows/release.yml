---
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: recover main
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    concurrency:
      group: recover-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    outputs:
      sha: ${{ steps.state.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Restart ci when GitHub never gave a job a runner, wait for it, and release a green main
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/recover.sh "${GITHUB_REPOSITORY}"

  release:
    name: release
    needs: [recover]
    if: >-
      !cancelled()
      && ((github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
      || needs.recover.outputs.sha != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || needs.recover.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
      - name: Install release tooling
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Audit the release tooling
        run: pnpm audit --audit-level high
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
      - name: Record the tag a release just published
        id: published
        run: echo "tag=$(git tag --points-at HEAD | head -n 1)" >> "${GITHUB_OUTPUT}"
      - name: Ask the tap to bump the formula
        if: steps.published.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.published.outputs.tag }}
        run: gh workflow run formula.yml --repo "${GITHUB_REPOSITORY}" --ref main -f tag="${TAG}"
