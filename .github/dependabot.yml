---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5,13,21 * * *"
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 5,13,21 * * *"
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      release-tooling:
        patterns:
          - "*"
